<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anno Viz</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div id="status">Loading...</div>
    <button id="rescanBtn" type="button">Rescan</button>
    <button id="applyDeletesBtn" type="button" disabled>Apply Deletes</button>
    <button id="closeBtn" type="button">Close</button>
  </header>
  <main id="stage">
    <canvas id="imageCanvas"></canvas>
  </main>
  <footer>
    <div id="help">n/Right next | b/Left prev | a add mode | drag box move/resize | Tab select | +/- class | 0-9 set class | Del remove box | s save labels | d mark delete | q close</div>
    <canvas id="timelineCanvas"></canvas>
  </footer>
  <div id="closePrompt" class="modalOverlay" hidden>
    <section class="modalDialog" role="dialog" aria-modal="true" aria-labelledby="closePromptTitle">
      <h2 id="closePromptTitle">Pending deletes</h2>
      <p id="closePromptText"></p>
      <div class="modalActions">
        <button id="closeApplyBtn" type="button">Apply & Close</button>
        <button id="closeDiscardBtn" type="button">Close Without Deleting</button>
      </div>
    </section>
  </div>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
